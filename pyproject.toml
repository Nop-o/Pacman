[project]
name = "pacman"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
	"mypy",
	"flake8",
	"pydantic>=2.13.4",
	"mazegenerator",
	"pygame>=2.6.1",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-00001/mazegenerator-2.1.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = "mazegenerator"
ignore_missing_imports = true